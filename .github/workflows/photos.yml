name: Update photo gallery

on:
  push:
    branches: [main]
    paths:
      - "assets/photos/**"
      - ".github/scripts/**"
      - ".github/workflows/photos.yml"
  workflow_dispatch:

permissions:
  contents: write

# Run one at a time. If you upload or delete several times quickly, the runs
# queue up instead of fighting over the push (the cause of the red X's).
concurrency:
  group: photo-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always start from the newest state of the branch
          fetch-depth: 0     # full history, so upload dates are known
      - name: Install Pillow
        run: pip install pillow
      - name: Watermark photos and build photos.json
        run: python3 .github/scripts/build_photos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/photos.json assets/thumbs assets/display
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update photo gallery"
          # if someone pushed in the meantime, pull their changes in and try again
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          echo "Could not push after 5 attempts"
          exit 1
