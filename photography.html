<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Photography by Sujith K. Mandala. Black-and-white photographs; open one to see it in colour." />
  <meta name="author" content="Sujith K. Mandala" />
  <title>Photography · Sujith K. Mandala</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='5' y='68' font-size='36' font-family='sans-serif' font-weight='700' fill='white'>SKM</text></svg>" />
  <!-- apply the saved theme before first paint (same rule as main.js) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      var light = window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.setAttribute("data-theme", t || (light ? "light" : "dark"));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
</head>

<body class="gallery-page">
  <header class="nav" id="navbar">
    <a href="index.html#home" class="brand">Sujith K. Mandala</a>
    <div class="nav-right">
      <nav class="nav-links" id="navLinks">
        <a href="index.html#about">About</a>
        <a href="index.html#experience">Experience</a>
        <a href="index.html#research">Research</a>
        <a href="photography.html" class="active" aria-current="page">Photography</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main class="gallery-wrap">
    <div class="section-head">
      <h2>Photography</h2>
    </div>
    <p class="gallery-intro">Select a photograph to see it in colour.</p>
    <ul id="grid" class="grid" aria-label="Photographs"></ul>
    <p id="status" class="gallery-status" role="status"></p>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-left"><span>© <span id="year"></span> Sujith K. Mandala</span><span class="dim">Bengaluru, India</span></div>
      <div class="footer-links">
        <a href="mailto:sujithkmandala15@gmail.com">Email</a>
        <a href="https://www.linkedin.com/in/sujithkmandala/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.kaggle.com/sujithmandala" target="_blank" rel="noopener">Kaggle</a>
        <a href="https://scholar.google.com/citations?user=06HHTG8AAAAJ&hl=en" target="_blank" rel="noopener">Scholar</a>
      </div>
    </div>
  </footer>

  <dialog id="viewer" aria-label="Photograph viewer">
    <img id="viewer-img" alt="">
    <button class="ctl close" type="button" aria-label="Close viewer">&times;</button>
    <button class="ctl prev" type="button" aria-label="Previous photograph">&lsaquo;</button>
    <button class="ctl next" type="button" aria-label="Next photograph">&rsaquo;</button>
  </dialog>

  <script src="assets/js/gallery.js"></script>
</body>

</html>
